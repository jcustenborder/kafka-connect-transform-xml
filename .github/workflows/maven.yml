name: Maven

on:
  pull_request:
    branches:
      - master
      - v0.2-SNAPSHOT
  push:
    branches:
      - master
      - v0.2-SNAPSHOT

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/v0.2-SNAPSHOT'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B clean verify

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-master
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - id: version
        shell: bash
        run: |
          set -euo pipefail

          snapshot_version="$(mvn -q -Dstyle.color=never -DforceStdout help:evaluate -Dexpression=project.version)"
          if [[ ! "${snapshot_version}" =~ ^[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
            echo "Root project version must be major.minor-SNAPSHOT. Found: ${snapshot_version}" >&2
            exit 1
          fi

          base_version="${snapshot_version%-SNAPSHOT}"
          git fetch --tags
          next_patch=0
          while IFS= read -r tag; do
            patch="${tag#"${base_version}."}"
            if [[ "${patch}" =~ ^(0|[1-9][0-9]*)$ ]]; then
              next_patch=$((10#${patch} + 1))
              break
            fi
          done < <(git tag --list "${base_version}.*" --sort=-version:refname)

          release_version="${base_version}.${next_patch}"
          if git rev-parse -q --verify "refs/tags/${release_version}" >/dev/null; then
            echo "Release tag ${release_version} already exists." >&2
            exit 1
          fi

          echo "version=${release_version}" >> "${GITHUB_OUTPUT}"
          echo "Computed release version: ${release_version}"
      - run: mvn -B versions:set -DgenerateBackupPoms=false -DnewVersion="${RELEASE_VERSION}"
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
      - run: mvn -B clean verify
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          package="target/components/packages/jcustenborder-kafka-connect-transform-xml-${RELEASE_VERSION}.zip"
          test -f "${package}"
          gh release create "${RELEASE_VERSION}" "${package}" --target "${GITHUB_SHA}" --title "${RELEASE_VERSION}" --generate-notes
